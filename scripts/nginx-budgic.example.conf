# Example nginx vhost for https://budgic.example.com
# Install: sudo htpasswd -c /etc/nginx/budgic.htpasswd tester1
# Add more users: sudo htpasswd /etc/nginx/budgic.htpasswd tester2

server {
    listen 443 ssl http2;
    server_name budgic.example.com;

    # ssl_certificate /etc/letsencrypt/live/budgic.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/budgic.example.com/privkey.pem;

    auth_basic "Budgic";
    auth_basic_user_file /etc/nginx/budgic.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Remote-User $remote_user;

        # Service worker / large backup uploads
        client_max_body_size 50m;
    }
}
